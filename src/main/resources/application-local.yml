# Local demo without Docker/MySQL — same API behavior as production profile.
spring:
  datasource:
    url: jdbc:h2:mem:partnerlink;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
  h2:
    console:
      enabled: true
      path: /h2-console

partnerlink:
  mun:
    delay-ms: 500
    timeout-ms: 3000
    default-result: APPROVED
